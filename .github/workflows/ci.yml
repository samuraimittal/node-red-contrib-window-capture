name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Linux X11/XCB packages & Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libxrandr2 libdbus-1-3 xvfb
      - name: Run tests with Xvfb on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - name: Run tests on Windows/macOS
        if: runner.os != 'Linux'
        run: npm test